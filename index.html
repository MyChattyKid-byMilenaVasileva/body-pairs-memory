<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Body Pairs · Memory</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><div class="compact-title">Body Pairs <span>Go Getter 1 · Unit 4</span></div><div class="tools"><button id="sound" aria-pressed="true" title="Sound">♫ Sound on</button><button id="embed">&lt;/&gt; Embed</button><button id="full" title="Full screen">⛶</button></div></header>
<section class="controls" aria-label="Game settings"><div class="rounds" aria-label="Number of pairs"><button data-count="6" class="active">6 pairs</button><button data-count="8">8 pairs</button><button data-count="13">All 13</button><button id="choose">Choose words</button></div><div class="options"><label><input type="checkbox" id="labels"> Show words</label><label><input type="checkbox" id="slow"> Take your time</label></div></section>
<section class="players" aria-label="Players"><div class="player active" id="player0"><span class="playerdot">1</span><label><span class="name-label">Player name</span><input id="name0" value="Player 1" maxlength="18" aria-label="Player 1 name"></label><strong id="score0">0</strong></div><div class="turn" id="turn" aria-live="polite">Player 1’s turn</div><div class="player" id="player1"><span class="playerdot">2</span><label><span class="name-label">Player name</span><input id="name1" value="Player 2" maxlength="18" aria-label="Player 2 name"></label><strong id="score1">0</strong></div></section><section class="gamebar"><div class="stats"><span><b id="found">0 / 6</b> pairs</span><span><b id="moves">0</b> turns</span></div><button id="restart">↻ New game</button></section>
<div class="progress"><div id="fill"></div></div>
<section class="board" id="board" aria-label="Game cards"></section>
<div class="feedback" aria-live="polite"><span id="message"></span><button id="next" hidden>Next player →</button></div>
<footer><em>by Milena Vasileva</em><a class="vk-link" href="https://vk.ru/club225157002" target="_blank" rel="noopener noreferrer" aria-label="ChattyBunny on VK"><b>VK</b> ChattyBunny ↗</a></footer>
</main>
<dialog id="picker"><form method="dialog"><button class="close" aria-label="Close">×</button></form><h2>Choose words</h2><div class="picktools"><button id="all">Select all</button><button id="none">Clear all</button></div><div id="wordlist"></div><p id="pickerror" role="alert"></p><button id="startSelected" class="primary">Start game →</button></dialog>
<dialog id="win"><div class="winmark">✓</div><h2 id="wintitle">Perfect match!</h2><p id="wintext"></p><div id="review"></div><button id="again" class="primary">Play again →</button><button id="look" class="secondary">View cards</button></dialog>
<dialog id="embedDialog"><form method="dialog"><button class="close" aria-label="Close">×</button></form><h2>Embed game</h2><p>In Holst, select “Embed iFrame code” and paste this code:</p><textarea id="embedcode" readonly aria-label="Embed code"></textarea><button id="copyEmbed" class="primary">Copy code</button><p>Two players share one game screen. Moves do not sync across devices.</p></dialog><div id="confetti" aria-hidden="true"></div><script src="app.js"></script></body></html>
