function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function beep(win=false){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();[0,.13,...(win?[.26]:[])].forEach((t,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=[523,659,784][i];g.gain.setValueAtTime(.05,audio.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+t+.15);o.start(audio.currentTime+t);o.stop(audio.currentTime+t+.16)})}catch(e){}}
function flipSound(){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const n=Math.floor(audio.sampleRate*.09),buf=audio.createBuffer(1,n,audio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();src.buffer=buf;filter.type='bandpass';filter.frequency.value=1700;filter.Q.value=.7;gain.gain.value=.18;src.connect(filter);filter.connect(gain);gain.connect(audio.destination);src.start()}catch(e){}}

let musicNodes=[];
function stopMusic(){musicNodes.forEach(n=>{try{n.stop()}catch(e){}});musicNodes=[]}
function victoryMusic(){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const now=audio.currentTime+.03;function note(f,t,d,type,vol){const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(0,now+t);g.gain.linearRampToValueAtTime(vol,now+t+.015);g.gain.exponentialRampToValueAtTime(.001,now+t+d);o.start(now+t);o.stop(now+t+d+.03);musicNodes.push(o)}const tune=[523,659,784,1047,0,784,880,1047,1175,1047,880,784,659,784,1047,1319];tune.forEach((f,i)=>{if(f)note(f,i*.15,.23,'triangle',.13)});[261.63,349.23,392,523.25].forEach((f,i)=>{note(f,i*.6,.55,'sine',.11);note(f*1.5,i*.6,.55,'triangle',.035)});for(let i=0;i<8;i++)note(i%2?130:65,i*.3,.12,'sine',.16);[523.25,659.25,783.99,1046.5].forEach(f=>note(f,2.4,1.1,'triangle',.055))}catch(e){}}
function balancedRows(total, rows){const base=Math.floor(total/rows),counts=Array(rows).fill(base);const order=Array.from({length:rows},(_,i)=>i).sort((a,b)=>Math.abs(a-(rows-1)/2)-Math.abs(b-(rows-1)/2)||a-b);for(let i=0;i<total%rows;i++)counts[order[i]]++;return counts}
function fitBoard(){const board=$('#board');if(!board.children.length)return;const w=board.clientWidth,gap=10,available=Math.max(240,window.innerHeight-board.getBoundingClientRect().top-65);let best=0,bestRows=3;for(let rows=1;rows<=Math.ceil(deck.length/2);rows++){const cols=Math.ceil(deck.length/rows);if(cols>8||cols<2)continue;const size=Math.min((w-gap*(cols-1))/cols,(available-gap*(rows-1))/rows,270);if(size>best){best=size;bestRows=rows}}const counts=balancedRows(deck.length,bestRows),cols=Math.max(...counts),size=Math.max(72,Math.floor(best));board.style.gridTemplateColumns=`repeat(${cols*2},${(size-gap)/2}px)`;board.style.gridAutoRows=size+'px';let index=0;counts.forEach((count,row)=>{const offset=cols-count;for(let col=0;col<count;col++){const card=board.children[index++];card.style.gridRow=String(row+1);card.style.gridColumn=`${offset+col*2+1} / span 2`}});}

function reset(indices){stopMusic();generation++;clearTimeout(timer);selected=[...indices];deck=shuffle(indices.flatMap(i=>words[i].map((word,side)=>({pair:i,side,word}))));flipped=[];matched=0;moves=0;busy=false;current=0;scores=[0,0];$('#next').hidden=true;$('#win').close();$('#board').className='board'+(indices.length>8?' full':indices.length>6?' medium':'');$('#board').replaceChildren();deck.forEach((c,i)=>{let b=document.createElement('button');b.className='card'+(mode==='phrases'?(c.side===1?' text-card':' image-card'):'');b.setAttribute('aria-label','Card '+(i+1)+', face down');b.innerHTML=`<span class="inner"><span class="back"><small>${String(i+1).padStart(2,'0')}</small><svg class="bot" viewBox="0 0 180 150" aria-hidden="true"><path d="M90 27V12" stroke="#a5edeb" stroke-width="7"/><circle cx="90" cy="9" r="8" fill="#ffc752"/><rect x="20" y="59" width="19" height="40" rx="9" fill="#a5edeb"/><rect x="141" y="59" width="19" height="40" rx="9" fill="#a5edeb"/><rect x="32" y="30" width="116" height="98" rx="30" fill="#b6f2eb"/><rect x="43" y="44" width="94" height="65" rx="22" fill="#283567"/><circle cx="68" cy="70" r="7" fill="#fff"/><circle cx="112" cy="70" r="7" fill="#fff"/><path d="M75 89Q90 100 105 89" fill="none" stroke="#ffc752" stroke-width="6" stroke-linecap="round"/><path d="M80 125h20v12H80z" fill="#7bd8d3"/><path d="M64 138h52" stroke="#b6f2eb" stroke-width="10" stroke-linecap="round"/></svg></span><span class="front" aria-hidden="true">${cardFront(c)}</span></span>`;b.addEventListener('click',()=>flip(i));$('#board').append(b)});update();setMessage('');requestAnimationFrame(fitBoard);}

function flip(i){let b=$('#board').children[i];if(busy||b.classList.contains('matched')||b.classList.contains('open'))return;flipSound();b.classList.add('open');b.querySelector('.front').setAttribute('aria-hidden','false');b.setAttribute('aria-label',deck[i].word);flipped.push(i);if(flipped.length===1){setMessage('');return}moves++;update();const[a,c]=flipped;if(deck[a].pair===deck[c].pair){flipped.forEach(j=>{$('#board').children[j].classList.add('matched','owner'+current);$('#board').children[j].disabled=true});matched++;scores[current]++;flipped=[];update();beep();const w=words[deck[a].pair];setMessage(w[0]+' · +1',true);if(matched===selected.length){busy=true;let g=generation;timer=setTimeout(()=>{if(g===generation)finish()},750)}}else{busy=true;setMessage($('#slow').checked?'Not a pair. Click Next player.':'Not a pair. Next player in 3 seconds.');if($('#slow').checked){$('#next').hidden=false;$('#next').focus()}else{timer=setTimeout(closeMismatch,3000)}}}

document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.rounds button').forEach(x=>x.classList.remove('active'));b.classList.add('active');reset(shuffle(words.map((_,i)=>i)).slice(0,+b.dataset.count))});
[0,1].forEach(i=>$('#name'+i).addEventListener('input',updatePlayers));
$('#restart').onclick=()=>reset(selected);$('#next').onclick=closeMismatch;
$('#labels').onchange=e=>document.body.classList.toggle('show-labels',e.target.checked);
$('#slow').onchange=()=>{if(busy&&flipped.length===2){clearTimeout(timer);if($('#slow').checked)$('#next').hidden=false;else{$('#next').hidden=true;timer=setTimeout(closeMismatch,3000)}}};
$('#sound').onclick=()=>{sound=!sound;$('#sound').setAttribute('aria-pressed',sound);$('#sound').textContent=sound?'♫ Sound on':'♫ Sound off';if(!sound)stopMusic();if(sound)flipSound()};
$('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){setMessage('Full screen is unavailable. Open the game in a new tab.')}};
words.forEach((w,i)=>{let label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=i;label.append(input,document.createTextNode(' '+w[0]));$('#wordlist').append(label)});
$('#choose').onclick=()=>{$('#wordlist').querySelectorAll('input').forEach(x=>x.checked=selected.includes(+x.value));$('#pickerror').textContent='';$('#picker').showModal()};
$('#all').onclick=()=>$('#wordlist').querySelectorAll('input').forEach(x=>x.checked=true);$('#none').onclick=()=>$('#wordlist').querySelectorAll('input').forEach(x=>x.checked=false);
$('#startSelected').onclick=()=>{let chosen=[...$('#wordlist').querySelectorAll('input:checked')].map(x=>+x.value);if(chosen.length<2){$('#pickerror').textContent='Choose at least 2 pairs.';return}document.querySelectorAll('.rounds button').forEach(x=>x.classList.remove('active'));$('#choose').classList.add('active');$('#picker').close();reset(chosen)};
$('#again').onclick=()=>reset(selected);$('#look').onclick=()=>$('#win').close();
reset(shuffle(words.map((_,i)=>i)).slice(0,6));

$('#embed').onclick=()=>{$('#embedcode').value='<iframe src="'+new URL('./',location.href).href+'" width="1100" height="820" style="border:0;border-radius:20px" allow="fullscreen; autoplay" allowfullscreen title="Robot Friends Memory"></iframe>';$('#embedDialog').showModal()};$('#copyEmbed').onclick=async()=>{try{await navigator.clipboard.writeText($('#embedcode').value);$('#copyEmbed').textContent='Copied ✓'}catch(e){$('#embedcode').select();$('#copyEmbed').textContent='Press Ctrl+C to copy'}};
</script></body></html>
